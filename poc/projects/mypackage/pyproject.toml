[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mypackage"
version = "0.1.0"
description = "Testing cookiecutter for project folder organization"
readme = "README.rst"
authors = [
  {name = "JD Margulici", email = "jdm@novavia.us"}
]
maintainers = [
  {name = "JD Margulici", email = "jdm@novavia.us"}
]
classifiers = [

]
license = {text = "Not open source"}
dependencies = [
  
]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pytest",  # testing
    "ruff"  # linting
]

[project.urls]

bugs = "https://github.com/jdmargulici/mypackage/issues"
changelog = "https://github.com/jdmargulici/mypackage/blob/master/changelog.md"
homepage = "https://github.com/jdmargulici/mypackage"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]




# Mypy
# ----

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"


[tool.poetry]
name = "anaximander"
version = "0.5a1"
description = "The rapid application development framework for data-intensive Python"
license = "MPL-2.0"
authors = [
    "Novavia Solutions <info@novavia.us>",
    "JD Margulici <jdmargulici@gmail.com>",
]
readme = "README.md"
homepage = "https://www.anaximander.dev"
repository = "https://github.com/novavia/anaximander"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
numpy = ">= 2"
pandas = ">= 2"
python-dotenv = "*"
attrs = "^24.2.0"
jinja2 = "^3.1.4"
cookiecutter = "^2.6.0"
sqlalchemy = "^2.0.36"
psycopg2 = "^2.9.10"
runtype = "^0.5.2"
inflect = "^7.5.0"
omegaconf = "^2.3.0"
astpretty = "^3.0.0"
ibis = "^3.3.0"
pydantic = "^2.12.4"
pandera = "^0.27.0"

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-postgresql = "^6.1.1"

[tool.poetry.group.dev.dependencies]
black = "*"
ipykernel = "*"
ipython = "*"
mypy = "*"
pip = "*"
pipx = "^1.7.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 99
per-file-ignores = { "**/__init__.py" = ["F401", "I001"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true  # Prevents commas from forcing multi-line breaks

[tool.ruff.lint]
select = [
    "F",    # Pyflakes (includes unused imports F401)
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (organize imports)
]
extend-select = ["E501"]
unfixable = ["F401"]  # Warn about unused imports, but do not delete them on save

[tool.ruff.lint.isort]
known-first-party = ["anaximander"]
